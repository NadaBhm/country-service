---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: v1
    dockerfile_path: './'
    full_image: "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"

  tasks:
    - name: Log in to Docker Hub
      command: docker login -u {{ dockerhub_username }} --password-stdin
      args:
        stdin: "{{ dockerhub_password }}"
      no_log: true

    - name: Build Docker image
      command: docker build -t {{ full_image }} {{ dockerfile_path }}

    - name: Push the Docker image to Docker Hub
      command: docker push {{ full_image }}

    - name: Apply Kubernetes Deployment
      command: kubectl --kubeconfig config apply -f deployment.yaml

    - name: Apply Kubernetes Service
      command: kubectl --kubeconfig config apply -f service.yaml